<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>我的 Python 作品集</title>
</head>
<body>

    <h1>歡迎來到我的 Flask 作品集</h1>
    <p>這是我的個人照片（已啟動防盜拷保護）：</p>

    <!-- 【外層大框框】用來固定圖片和遮罩的範圍 -->
    <div style="position: relative; display: inline-block; user-select: none; -webkit-user-select: none;">
        
        <!-- 1. 底層：你的真實 JPG 圖片 -->
        <img src="{{ url_for('static', filename='my_image.jpg') }}" alt="個人照" width="200" style="display: block;">
        
        <!-- 2. 頂層：覆蓋在圖片正上方的「透明玻璃遮罩」 -->
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent;" oncontextmenu="return false;"></div>
    
    </div>

</body>
	<nav>
		<a href="{{ url_for('home') }}" class="{% if active_page == 'home' %}active{% endif %}">首頁</a>
		<a href="{{ url_for('about') }}" class="{% if active_page == 'about' %}active{% endif %}">關於</a>
		<a href="{{ url_for('portfolio') }}" class="{% if active_page == 'portfolio' %}active{% endif %}">作品集</a>
	</nav>
<!-- 頁面主要內容 -->
    <div class="container">
        <h1>首頁</h1>
        <p>這是首頁的內容。您可以點擊上方導覽列切換到「關於」或「作品集」。</p>
    </div>

</body>
</html>
