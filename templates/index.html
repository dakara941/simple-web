<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>我的 Python 作品集</title>
</head>
<body>

    <h1>歡迎來到我的 Flask 作品集</h1>
    <p>這是我的個人照片（已啟動防盜拷保護）：</p>

    <!-- 【外層大框框】用來固定圖片和遮罩的範圍 -->
    <div style="position: relative; display: inline-block; user-select: none; -webkit-user-select: none;">
        
        <!-- 1. 底層：你的真實 JPG 圖片 -->
        <img src="{{ url_for('static', filename='my_image.jpg') }}" alt="個人照" width="200" style="display: block;">
        
        <!-- 2. 頂層：覆蓋在圖片正上方的「透明玻璃遮罩」 -->
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent;" oncontextmenu="return false;"></div>
    
    </div>

</body>
</html>
